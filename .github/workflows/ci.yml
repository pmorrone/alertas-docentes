name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: alertas-docentes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        # Proves the runtime has everything it reads at startup (catalogs, synonyms) and that
        # the native SQLite module loads on this platform.
        run: |
          docker run --rm alertas-docentes:ci node -e "
            Promise.all([import('./dist/nlu/index.js'), import('better-sqlite3')]).then(([nlu, sqlite]) => {
              const result = nlu.loadInterpreter().interpret('historia en pilar a la tarde');
              if (result.kind !== 'create') throw new Error('unexpected: ' + result.kind);
              new sqlite.default(':memory:').close();
              console.log('image OK:', result.summary);
            });
          "
